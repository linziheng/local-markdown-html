<!doctype html>
<html lang="en" data-theme="white">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Markdown</title>
  <script>
    try {
      const theme = localStorage.getItem("LocalMarkdown:theme:v1");
      if (["white", "solarized-light", "solarized-dark"].includes(theme)) {
        document.documentElement.dataset.theme = theme;
      }
    } catch {}
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3.5' y='6.5' width='25' height='19' rx='3.5' fill='white' stroke='%23111' stroke-width='2'/%3E%3Cpath d='M7.5 21V11.5l4.7 4.7 4.4-4.7V21m6-9.5V21m-3-3 3 3 3-3' fill='none' stroke='%23111' stroke-width='2.25' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.11.2/dist/index.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    :root {
      color-scheme: light;
      --lm-background: #fff;
      --lm-surface: #fafafa;
      --lm-subtle: #f6f6f6;
      --lm-selected: #f1f1f1;
      --lm-text: #111;
      --lm-muted: #666;
      --lm-faint: #aaa;
      --lm-border: #e5e5e5;
      --lm-control-border: #d8d8d8;
      --lm-accent: #111;
      --lm-overlay: rgba(0, 0, 0, 0.18);
      --lm-sidebar-shadow: rgba(0, 0, 0, 0.12);
      --lm-menu-shadow: rgba(0, 0, 0, 0.16);
      --lm-selection: rgba(17, 17, 17, 0.14);
    }
    :root[data-theme="solarized-light"] {
      color-scheme: light;
      --lm-background: #fdf6e3;
      --lm-surface: #eee8d5;
      --lm-subtle: #f5efdc;
      --lm-selected: #e5deca;
      --lm-text: #586e75;
      --lm-muted: #657b83;
      --lm-faint: #93a1a1;
      --lm-border: #d8d1bd;
      --lm-control-border: #c9c2ae;
      --lm-accent: #268bd2;
      --lm-overlay: rgba(0, 43, 54, 0.22);
      --lm-sidebar-shadow: rgba(0, 43, 54, 0.16);
      --lm-menu-shadow: rgba(0, 43, 54, 0.22);
      --lm-selection: rgba(38, 139, 210, 0.2);
    }
    :root[data-theme="solarized-dark"] {
      color-scheme: dark;
      --lm-background: #002b36;
      --lm-surface: #073642;
      --lm-subtle: #0b3b47;
      --lm-selected: #10424e;
      --lm-text: #93a1a1;
      --lm-muted: #839496;
      --lm-faint: #657b83;
      --lm-border: #164653;
      --lm-control-border: #315661;
      --lm-accent: #2aa198;
      --lm-overlay: rgba(0, 0, 0, 0.42);
      --lm-sidebar-shadow: rgba(0, 0, 0, 0.34);
      --lm-menu-shadow: rgba(0, 0, 0, 0.42);
      --lm-selection: rgba(42, 161, 152, 0.24);
    }
    ::selection { background: var(--lm-selection); }
    body {
      color: var(--lm-text);
      background: var(--lm-background);
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { color: inherit; background: var(--lm-background); border: 1px solid var(--lm-control-border); border-radius: 5px; font: inherit; cursor: pointer; }
    button:hover { background: var(--lm-subtle); }
    button:disabled { color: var(--lm-faint); cursor: default; }
    button:focus-visible { outline: 2px solid var(--lm-accent); outline-offset: 2px; }

    .LocalMarkdown-app {
      --sidebar-width: 220px;
      height: 100%; display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      transition: grid-template-columns 160ms ease;
    }
    .LocalMarkdown-app[data-sidebar="closed"] { --sidebar-width: 0px; }
    .LocalMarkdown-sidebar {
      min-width: 0; min-height: 0; overflow: hidden; border-right: 1px solid var(--lm-border);
      background: var(--lm-background);
      display: grid; grid-template-rows: 40px minmax(0, 1fr);
      opacity: 1; visibility: visible;
      transition: opacity 100ms ease, visibility 0s;
    }
    .LocalMarkdown-app[data-sidebar="closed"] .LocalMarkdown-sidebar {
      border-right: 0; opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 100ms ease, visibility 0s 100ms;
    }
    .LocalMarkdown-sidebar-backdrop { display: none; }
    .LocalMarkdown-sidebar-header,
    .LocalMarkdown-toolbar { height: 40px; padding: 0 10px; border-bottom: 1px solid var(--lm-border); }
    .LocalMarkdown-sidebar-header { display: flex; align-items: center; gap: 8px; }
    .LocalMarkdown-sidebar-header strong {
      min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .LocalMarkdown-logo { width: 24px; height: 24px; flex: 0 0 24px; }
    .LocalMarkdown-logo rect { fill: var(--lm-background); stroke: var(--lm-text); }
    .LocalMarkdown-logo path { stroke: var(--lm-text); }
    .LocalMarkdown-new {
      width: 30px; height: 30px; padding: 0; border: 0; border-radius: 3px;
      background: transparent; font-size: 20px; line-height: 1;
    }
    .LocalMarkdown-sidebar-dismiss {
      display: none; width: 30px; height: 30px; padding: 0;
      border: 0; border-radius: 3px; background: transparent;
    }
    .LocalMarkdown-files {
      min-height: 0; overflow: auto; padding: 8px;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .LocalMarkdown-files::-webkit-scrollbar { display: none; width: 0; height: 0; }
    .LocalMarkdown-file {
      width: 100%; margin: 0 0 3px; padding: 8px 9px; overflow: hidden;
      border: 0; text-align: left; text-overflow: ellipsis; white-space: nowrap;
      transition: opacity 80ms ease;
    }
    .LocalMarkdown-file[draggable="true"] { cursor: grab; }
    .LocalMarkdown-file[draggable="true"]:active { cursor: grabbing; }
    .LocalMarkdown-file[aria-current="true"] { background: var(--lm-selected); font-weight: 600; }
    .LocalMarkdown-file.LocalMarkdown-dragging { opacity: 0; }
    .LocalMarkdown-main { min-width: 0; min-height: 0; display: grid; grid-template-rows: 40px minmax(0, 1fr); }
    .LocalMarkdown-toolbar {
      display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center; gap: 8px;
    }
    .LocalMarkdown-toolbar-left {
      min-width: 0; display: flex; align-items: center; gap: 4px;
    }
    .LocalMarkdown-sidebar-toggle {
      width: 30px; height: 30px; padding: 0; flex: 0 0 30px;
      display: inline-grid; place-items: center;
      border: 0; border-radius: 3px; background: transparent;
    }
    .LocalMarkdown-sidebar-toggle svg,
    .LocalMarkdown-sidebar-dismiss svg { width: 18px; height: 18px; }
    .LocalMarkdown-status {
      min-width: 0; margin-left: 4px; padding-left: 8px; overflow: hidden;
      border-left: 1px solid var(--lm-border); color: var(--lm-muted); font-size: 12px;
      text-overflow: ellipsis; white-space: nowrap;
    }
    .LocalMarkdown-view-switcher {
      display: inline-flex; justify-self: center; gap: 2px;
    }
    .LocalMarkdown-view {
      padding: 4px 8px; border: 0; border-radius: 3px;
      color: var(--lm-faint); background: transparent; font-size: 13px; white-space: nowrap;
    }
    .LocalMarkdown-view[aria-pressed="true"] { color: var(--lm-text); font-weight: 400; }
    .LocalMarkdown-actions { display: flex; align-items: center; justify-self: end; gap: 2px; }
    .LocalMarkdown-action {
      padding: 4px 7px; border: 0; border-radius: 3px; background: transparent; font-size: 13px;
    }
    .LocalMarkdown-theme-picker {
      position: relative;
    }
    .LocalMarkdown-theme-toggle {
      width: 30px; height: 28px; padding: 0; display: inline-grid; place-items: center;
      border: 0; border-radius: 3px; background: transparent;
    }
    .LocalMarkdown-theme-toggle svg { width: 17px; height: 17px; }
    .LocalMarkdown-theme-menu {
      position: absolute; z-index: 20; top: calc(100% + 7px); left: 0;
      width: max-content; min-width: 164px; padding: 5px;
      border: 1px solid var(--lm-control-border); border-radius: 7px;
      background: var(--lm-background); box-shadow: 0 5px 18px var(--lm-menu-shadow);
    }
    .LocalMarkdown-theme-menu[hidden] { display: none; }
    .LocalMarkdown-theme-option {
      width: 100%; padding: 7px 9px; display: flex; align-items: center;
      border: 0; border-radius: 4px; color: var(--lm-faint); background: transparent;
      font-size: 13px; text-align: left; white-space: nowrap;
    }
    .LocalMarkdown-theme-option[aria-checked="true"] {
      color: var(--lm-text); background: transparent; font-weight: 400;
    }
    .LocalMarkdown-theme-option:focus-visible {
      outline: 0; box-shadow: inset 0 0 0 1px var(--lm-accent);
    }
    .LocalMarkdown-editor {
      position: relative; z-index: 1;
      min-width: 0; min-height: 0; overflow: visible;
    }

    .LocalMarkdown-editor.vditor {
      --toolbar-height: 30px;
      --toolbar-divider-margin-top: 7px;
      --border-color: var(--lm-border);
      --second-color: var(--lm-selection);
      --panel-background-color: var(--lm-background);
      --panel-shadow: 0 1px 5px var(--lm-menu-shadow);
      --toolbar-background-color: var(--lm-surface);
      --toolbar-icon-color: var(--lm-muted);
      --toolbar-icon-hover-color: var(--lm-accent);
      --textarea-background-color: var(--lm-background);
      --textarea-text-color: var(--lm-text);
      --resize-icon-color: var(--lm-muted);
      --resize-background-color: var(--lm-surface);
      --resize-hover-icon-color: var(--lm-background);
      --resize-hover-background-color: var(--lm-accent);
      --count-background-color: var(--lm-selection);
      --heading-border-color: var(--lm-border);
      --blockquote-color: var(--lm-muted);
      --ir-heading-color: #6c71c4;
      --ir-title-color: var(--lm-muted);
      --ir-bi-color: #cb4b16;
      --ir-link-color: #859900;
      --ir-bracket-color: #268bd2;
      --ir-paren-color: #2aa198;
      height: 100% !important; border: 0; border-radius: 0;
    }
    .LocalMarkdown-editor .vditor-toolbar {
      flex-shrink: 0; padding: 0 8px;
      border: 0; border-bottom: 1px solid var(--lm-border); background: var(--lm-surface);
    }
    .LocalMarkdown-editor .vditor-toolbar__item .vditor-tooltipped { width: 23px; padding: 7px 4px; }
    .LocalMarkdown-editor .vditor-toolbar__divider { margin-right: 5px; margin-left: 5px; }
    .LocalMarkdown-internal-edit-mode { display: none !important; }
    .LocalMarkdown-editor .vditor-counter,
    .LocalMarkdown-editor .vditor-resize { display: none !important; }
    .LocalMarkdown-editor .vditor-content { flex: 1; min-height: 0; height: auto !important; }
    .LocalMarkdown-editor .vditor-ir,
    .LocalMarkdown-editor .vditor-wysiwyg { width: 100%; margin: 0; padding: 0 !important; background: var(--lm-background); }
    .LocalMarkdown-editor .vditor-reset { color: var(--lm-text); font-family: inherit; }
    .LocalMarkdown-editor .vditor-reset :is(h1, h2, h3, h4, h5, h6) {
      color: var(--lm-text); border-bottom-color: var(--lm-border);
    }
    .LocalMarkdown-editor .vditor-reset pre { background-color: var(--lm-surface); }
    .LocalMarkdown-editor .vditor-reset code:not(.hljs):not(.highlight-chroma) {
      color: var(--lm-text); background-color: var(--lm-surface);
    }
    .LocalMarkdown-editor .vditor-reset table tr { background-color: var(--lm-background); }
    .LocalMarkdown-editor .vditor-reset table tr:nth-child(2n) { background-color: var(--lm-subtle); }
    .LocalMarkdown-editor .vditor-reset :is(td, th) { border-color: var(--lm-border); }
    .LocalMarkdown-editor .vditor-reset hr { background-color: var(--lm-border); }
    .LocalMarkdown-editor .vditor-reset a { color: var(--lm-accent); }
    .LocalMarkdown-editor :is(.vditor-ir, .vditor-wysiwyg)
    .vditor-reset > :is(h1, h2, h3, h4, h5, h6)::before { content: none !important; }

    @media (max-width: 900px) {
      .LocalMarkdown-toolbar { grid-template-columns: auto minmax(0, 1fr) auto; }
      .LocalMarkdown-status { display: none; }
      .LocalMarkdown-view-switcher { justify-self: center; }
      .LocalMarkdown-actions { grid-column: 3; grid-row: 1; }
    }

    @media (max-width: 650px) {
      .LocalMarkdown-app,
      .LocalMarkdown-app[data-sidebar="closed"] {
        --sidebar-width: 0px;
        grid-template-columns: minmax(0, 1fr);
        transition: none;
      }
      .LocalMarkdown-sidebar {
        position: fixed; z-index: 3; inset: 0 auto 0 0;
        width: min(280px, 85vw); background: var(--lm-background);
        box-shadow: 12px 0 28px var(--lm-sidebar-shadow);
        transform: translateX(0);
        transition: transform 160ms ease, visibility 0s;
      }
      .LocalMarkdown-app[data-sidebar="closed"] .LocalMarkdown-sidebar {
        border-right: 1px solid var(--lm-border); opacity: 1;
        transform: translateX(-100%);
        transition: transform 160ms ease, visibility 0s 160ms;
      }
      .LocalMarkdown-sidebar-backdrop {
        position: fixed; z-index: 2; inset: 0; display: block;
        background: var(--lm-overlay); opacity: 1;
        transition: opacity 160ms ease;
      }
      .LocalMarkdown-app[data-sidebar="closed"] .LocalMarkdown-sidebar-backdrop {
        opacity: 0; pointer-events: none;
      }
      .LocalMarkdown-sidebar-header { padding: 0 8px; }
      .LocalMarkdown-sidebar-dismiss { display: inline-grid; place-items: center; }
      .LocalMarkdown-toolbar { padding: 0 8px; gap: 5px; }
      .LocalMarkdown-view { padding: 4px 3px; font-size: 12px; }
      .LocalMarkdown-action { padding: 4px 3px; font-size: 12px; }
      .LocalMarkdown-theme-option { font-size: 12px; }
      .LocalMarkdown-editor .vditor-toolbar { padding: 0 6px; }
    }

    @media (max-width: 360px) {
      .LocalMarkdown-toolbar { padding: 0 4px; gap: 2px; }
      .LocalMarkdown-view { padding: 4px 2px; font-size: 11px; }
      .LocalMarkdown-action { padding: 4px 2px; font-size: 11px; }
      .LocalMarkdown-theme-toggle { width: 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .LocalMarkdown-app,
      .LocalMarkdown-sidebar,
      .LocalMarkdown-sidebar-backdrop { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="LocalMarkdown-app" data-sidebar="open">
    <div class="LocalMarkdown-sidebar-backdrop" id="LocalMarkdown-sidebar-backdrop" aria-hidden="true"></div>
    <aside class="LocalMarkdown-sidebar" id="LocalMarkdown-sidebar" aria-label="Local Markdown open files">
      <div class="LocalMarkdown-sidebar-header">
        <svg class="LocalMarkdown-logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
          <rect x="3.5" y="6.5" width="25" height="19" rx="3.5" fill="#fff" stroke="#111" stroke-width="2"></rect>
          <path d="M7.5 21V11.5l4.7 4.7 4.4-4.7V21m6-9.5V21m-3-3 3 3 3-3" fill="none" stroke="#111" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
        <strong>Local Markdown</strong>
        <button class="LocalMarkdown-sidebar-dismiss" id="LocalMarkdown-sidebar-dismiss" type="button" aria-label="Hide sidebar" title="Hide sidebar">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <rect x="2.5" y="3" width="15" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
            <path d="M7 3.5v13M12 7l-3 3 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </button>
        <button class="LocalMarkdown-new" id="LocalMarkdown-new" type="button" aria-label="New file">+</button>
      </div>
      <nav class="LocalMarkdown-files" id="LocalMarkdown-files" aria-label="Documents"></nav>
    </aside>

    <main class="LocalMarkdown-main">
      <div class="LocalMarkdown-toolbar">
        <div class="LocalMarkdown-toolbar-left">
          <button class="LocalMarkdown-sidebar-toggle" id="LocalMarkdown-sidebar-toggle" type="button" aria-controls="LocalMarkdown-sidebar" aria-expanded="true" aria-label="Hide sidebar" title="Hide sidebar">
            <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
              <rect x="2.5" y="3" width="15" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"></rect>
              <path d="M7 3.5v13" fill="none" stroke="currentColor" stroke-width="1.5"></path>
            </svg>
          </button>
          <div class="LocalMarkdown-theme-picker">
            <button class="LocalMarkdown-theme-toggle" id="LocalMarkdown-theme-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="LocalMarkdown-theme-menu">
              <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false">
                <circle cx="10" cy="10" r="3.25" fill="none" stroke="currentColor" stroke-width="1.5"></circle>
                <path d="M10 2.25v1.5M10 16.25v1.5M2.25 10h1.5M16.25 10h1.5M4.52 4.52l1.06 1.06M14.42 14.42l1.06 1.06M15.48 4.52l-1.06 1.06M5.58 14.42l-1.06 1.06" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path>
              </svg>
            </button>
            <div class="LocalMarkdown-theme-menu" id="LocalMarkdown-theme-menu" role="menu" aria-label="Color theme" hidden>
              <button class="LocalMarkdown-theme-option" type="button" role="menuitemradio" data-theme-option="white" aria-checked="true">
                White
              </button>
              <button class="LocalMarkdown-theme-option" type="button" role="menuitemradio" data-theme-option="solarized-light" aria-checked="false">
                Solarized Light
              </button>
              <button class="LocalMarkdown-theme-option" type="button" role="menuitemradio" data-theme-option="solarized-dark" aria-checked="false">
                Solarized Dark
              </button>
            </div>
          </div>
          <span class="LocalMarkdown-status" id="LocalMarkdown-status" role="status">Loading editor…</span>
        </div>
        <div class="LocalMarkdown-view-switcher" role="group" aria-label="Editor view">
          <button class="LocalMarkdown-view" type="button" data-mode="wysiwyg" aria-pressed="false" title="Edit the rendered document" disabled>Visual</button>
          <button class="LocalMarkdown-view" type="button" data-mode="ir" aria-pressed="true" title="Edit Markdown with inline formatting" disabled>Markdown</button>
          <button class="LocalMarkdown-view" type="button" data-mode="sv" aria-pressed="false" title="Edit source beside a live preview" disabled>Split</button>
        </div>
        <div class="LocalMarkdown-actions">
          <button class="LocalMarkdown-action" id="LocalMarkdown-open-file" type="button" title="Open file">Open</button>
          <button class="LocalMarkdown-action" id="LocalMarkdown-save-file" type="button">Save</button>
          <button class="LocalMarkdown-action" id="LocalMarkdown-close-file" type="button">Close</button>
        </div>
      </div>
      <div class="LocalMarkdown-editor" id="LocalMarkdown-editor"></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vditor@3.11.2/dist/index.min.js"></script>
  <script>
    (async () => {
      "use strict";

      const vditorCdn = "https://cdn.jsdelivr.net/npm/vditor@3.11.2";
      const filesElement = document.querySelector("#LocalMarkdown-files");
      const appElement = document.querySelector(".LocalMarkdown-app");
      const sidebarElement = document.querySelector("#LocalMarkdown-sidebar");
      const sidebarBackdrop = document.querySelector("#LocalMarkdown-sidebar-backdrop");
      const sidebarToggle = document.querySelector("#LocalMarkdown-sidebar-toggle");
      const sidebarDismiss = document.querySelector("#LocalMarkdown-sidebar-dismiss");
      const mainElement = document.querySelector(".LocalMarkdown-main");
      const statusElement = document.querySelector("#LocalMarkdown-status");
      const closeButton = document.querySelector("#LocalMarkdown-close-file");
      const saveButton = document.querySelector("#LocalMarkdown-save-file");
      const editorElement = document.querySelector("#LocalMarkdown-editor");
      const viewButtons = document.querySelectorAll(".LocalMarkdown-view");
      const themeToggle = document.querySelector("#LocalMarkdown-theme-toggle");
      const themeMenu = document.querySelector("#LocalMarkdown-theme-menu");
      const themeOptions = Array.from(document.querySelectorAll(".LocalMarkdown-theme-option"));
      let editor = null;
      let editorReady = false;
      let attachmentPreviewTimer = null;
      let attachmentPreviewObserver = null;
      let imageWorker = null;
      let imageWorkerUrl = null;
      let imageWorkerRequestId = 0;
      let sessionDatabasePromise = null;
      let sessionSaveTimer = null;
      let sessionWritePromise = Promise.resolve();
      let sessionNeedsSave = false;
      let sessionRestored = false;
      let draggedFileId = null;
      const autoSaveTimers = new Map();
      const activeSaves = new Map();
      const attachmentPreviewUrls = new Map();
      const attachmentImageIds = new WeakMap();
      const imageWorkerRequests = new Map();
      const autoSaveDelay = 700;
      const attachmentBlockStart = "<!-- LocalMarkdown attachments:v1";
      const attachmentBlockEnd = "-->";
      const attachmentPathPrefix = "lmd/";
      const supportedAttachmentPathPrefixes = [
        attachmentPathPrefix,
        "local-markdown-attachment/"
      ];
      const attachmentPathPrefixPattern = supportedAttachmentPathPrefixes
        .map(prefix => prefix.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
        .join("|");
      const pastedImageMaxDimension = 2000;
      const pastedImageWebpQuality = 0.9;
      const sessionDatabaseName = "LocalMarkdown";
      const sessionStoreName = "workspace";
      const sessionStorageKey = "current:v1";
      const sessionSaveDelay = 200;
      const sidebarStorageKey = "LocalMarkdown:sidebar:v1";
      const themeStorageKey = "LocalMarkdown:theme:v1";
      const themeNames = {
        white: "White",
        "solarized-light": "Solarized Light",
        "solarized-dark": "Solarized Dark"
      };
      const markdownPickerId = "LocalMarkdownFile";
      const markdownPickerTypes = [{
        description: "Markdown file",
        accept: { "text/markdown": [".md", ".markdown"] }
      }];
      const mobileSidebarQuery = matchMedia("(max-width: 650px)");

      function setTheme(theme, { persist = true } = {}) {
        if (!Object.hasOwn(themeNames, theme)) theme = "white";
        document.documentElement.dataset.theme = theme;
        for (const option of themeOptions) {
          option.setAttribute("aria-checked", String(option.dataset.themeOption === theme));
        }
        themeToggle.setAttribute("aria-label", `Color theme: ${themeNames[theme]}`);
        themeToggle.title = `Color theme: ${themeNames[theme]}`;
        if (editorReady) {
          const dark = theme === "solarized-dark";
          const codeTheme = theme === "white" ? "github" : `base16/${theme}`;
          editor.setTheme(dark ? "dark" : "classic", dark ? "dark" : "light", codeTheme);
        }
        if (persist) {
          try { localStorage.setItem(themeStorageKey, theme); } catch {}
        }
      }

      function setThemeMenuOpen(open, { focus = false } = {}) {
        themeMenu.hidden = !open;
        themeToggle.setAttribute("aria-expanded", String(open));
        if (!open || !focus) return;
        (themeOptions.find(option => option.getAttribute("aria-checked") === "true")
          || themeOptions[0]).focus();
      }

      setTheme(document.documentElement.dataset.theme, { persist: false });

      const createId = () => crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`;
      const example = {
        id: "LocalMarkdown-examples", name: "Markdown examples", text: exampleText,
        handle: null, attachments: new Map(), builtin: true, dirty: false
      };
      const welcome = {
        id: "LocalMarkdown-welcome", name: "", text: "", handle: null,
        attachments: new Map(), builtin: true, welcome: true, dirty: false
      };
      const session = { activeId: example.id, files: [example], lastOpenHandle: null };

      function activeFile() {
        return session.files.find(file => file.id === session.activeId);
      }

      function openSessionDatabase() {
        if (!sessionDatabasePromise) {
          sessionDatabasePromise = new Promise((resolve, reject) => {
            if (typeof indexedDB === "undefined") {
              reject(new Error("Browser storage is unavailable"));
              return;
            }

            const request = indexedDB.open(sessionDatabaseName, 1);
            request.addEventListener("upgradeneeded", () => {
              if (!request.result.objectStoreNames.contains(sessionStoreName)) {
                request.result.createObjectStore(sessionStoreName);
              }
            });
            request.addEventListener("success", () => {
              const database = request.result;
              database.addEventListener("versionchange", () => database.close());
              resolve(database);
            });
            request.addEventListener("error", () => reject(request.error));
            request.addEventListener("blocked", () => reject(new Error("Browser storage is blocked")));
          });
        }
        return sessionDatabasePromise;
      }

      async function readStoredSession() {
        const database = await openSessionDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(sessionStoreName, "readonly");
          const request = transaction.objectStore(sessionStoreName).get(sessionStorageKey);
          request.addEventListener("success", () => resolve(request.result || null));
          request.addEventListener("error", () => reject(request.error));
          transaction.addEventListener("abort", () => reject(transaction.error));
        });
      }

      async function writeStoredSession(snapshot) {
        const database = await openSessionDatabase();
        return new Promise((resolve, reject) => {
          const transaction = database.transaction(sessionStoreName, "readwrite");
          transaction.objectStore(sessionStoreName).put(snapshot, sessionStorageKey);
          transaction.addEventListener("complete", resolve);
          transaction.addEventListener("abort", () => reject(transaction.error));
          transaction.addEventListener("error", () => reject(transaction.error));
        });
      }

      function storedAttachments(file) {
        const referenced = referencedAttachmentIds(file.text);
        return Array.from(file.attachments.values())
          .filter(attachment => referenced.has(attachment.id) && attachment.data)
          .map(attachment => ({
            id: attachment.id,
            type: attachment.type,
            data: attachment.data
          }));
      }

      function sessionSnapshot() {
        return {
          version: 1,
          activeId: session.activeId,
          lastOpenHandle: session.lastOpenHandle,
          fileOrder: session.files
            .filter(file => !file.welcome)
            .map(file => file.id),
          files: session.files
            .filter(file => !file.builtin && !file.welcome)
            .map(file => ({
              id: file.id,
              name: file.name,
              text: file.text,
              handle: file.handle || null,
              dirty: Boolean(file.dirty),
              attachments: storedAttachments(file)
            }))
        };
      }

      function persistSessionNow() {
        if (!sessionRestored || !sessionNeedsSave) return sessionWritePromise;
        clearTimeout(sessionSaveTimer);
        sessionSaveTimer = null;
        const snapshot = sessionSnapshot();
        sessionNeedsSave = false;
        sessionWritePromise = sessionWritePromise
          .catch(() => {})
          .then(() => writeStoredSession(snapshot))
          .catch(() => {
            sessionNeedsSave = true;
            console.warn("Local Markdown could not use browser session storage.");
          });
        return sessionWritePromise;
      }

      function scheduleSessionSave() {
        if (!sessionRestored) return;
        sessionNeedsSave = true;
        clearTimeout(sessionSaveTimer);
        sessionSaveTimer = setTimeout(persistSessionNow, sessionSaveDelay);
      }

      function restoredAttachments(items) {
        const attachments = new Map();
        for (const item of Array.isArray(items) ? items : []) {
          if (!item || typeof item.id !== "string"
              || typeof item.type !== "string" || !item.type.startsWith("image/")
              || typeof item.data !== "string") continue;
          attachments.set(item.id, {
            id: item.id,
            type: item.type,
            data: item.data,
            blob: null,
            pending: null,
            error: false
          });
        }
        return attachments;
      }

      async function handlePermission(handle, mode) {
        if (!handle || typeof handle.queryPermission !== "function") return null;
        try {
          return await handle.queryPermission({ mode });
        } catch {
          return null;
        }
      }

      async function loadFileFromHandle(file) {
        const diskFile = await file.handle.getFile();
        const parsed = parseStoredMarkdown(await diskFile.text());
        file.name = diskFile.name;
        file.text = parsed.text;
        file.attachments = parsed.attachments;
        file.dirty = false;
        return parsed.warning;
      }

      async function refreshRestoredFile(file) {
        if (!file.handle) return false;
        const [readPermission, writePermission] = await Promise.all([
          handlePermission(file.handle, "read"),
          handlePermission(file.handle, "readwrite")
        ]);
        file.needsPermission = writePermission !== null && writePermission !== "granted";
        if (file.dirty || readPermission !== "granted") return false;
        try {
          await loadFileFromHandle(file);
          return true;
        } catch {
          file.needsPermission = true;
          return false;
        }
      }

      async function restoreSession() {
        let storedSession = null;
        try {
          storedSession = await readStoredSession();
        } catch {
          console.warn("Local Markdown could not use browser session storage.");
        }

        if (storedSession?.version === 1 && Array.isArray(storedSession.files)) {
          const restoredFiles = storedSession.files
            .filter(file => file && typeof file.id === "string"
              && typeof file.name === "string" && typeof file.text === "string")
            .map(file => ({
              id: file.id,
              name: file.name,
              text: file.text,
              handle: file.handle || null,
              attachments: restoredAttachments(file.attachments),
              builtin: false,
              dirty: Boolean(file.dirty),
              needsPermission: false
            }));

          const refreshedFiles = await Promise.all(restoredFiles.map(refreshRestoredFile));
          const availableFiles = [example, ...restoredFiles];
          const filesById = new Map(availableFiles.map(file => [file.id, file]));
          const orderedFiles = [];
          for (const id of Array.isArray(storedSession.fileOrder) ? storedSession.fileOrder : []) {
            const file = filesById.get(id);
            if (!file) continue;
            orderedFiles.push(file);
            filesById.delete(id);
          }
          session.files = [...orderedFiles, ...filesById.values()];
          session.activeId = session.files.some(file => file.id === storedSession.activeId)
            ? storedSession.activeId
            : (restoredFiles[0]?.id || example.id);
          session.lastOpenHandle = storedSession.lastOpenHandle?.kind === "file"
            ? storedSession.lastOpenHandle
            : (activeFile()?.handle || restoredFiles.find(file => file.handle)?.handle || null);
          if (refreshedFiles.some(Boolean)) sessionNeedsSave = true;
        }

        sessionRestored = true;
        if (sessionNeedsSave) scheduleSessionSave();
        for (const file of session.files) {
          if (!file.builtin && file.dirty && file.handle && !file.needsPermission) {
            scheduleAutoSave(file);
          }
        }
      }

      function captureEditorValue() {
        if (!editorReady) return;
        const file = activeFile();
        const value = canonicalEditorText(editor.getValue(), file);
        if (value === file.text) return;
        file.text = value;
        if (!file.builtin) {
          file.dirty = true;
          scheduleAutoSave(file);
          scheduleSessionSave();
        }
      }

      function updateStatus(message = null) {
        const file = activeFile();
        closeButton.disabled = Boolean(file.builtin || file.welcome);
        saveButton.textContent = file.handle && file.needsPermission ? "Reconnect" : "Save";
        saveButton.hidden = Boolean(file.builtin || file.welcome
          || (file.handle && !file.needsPermission));
        if (message) statusElement.textContent = message;
        else if (file.welcome) statusElement.textContent = "Open a file or view Examples";
        else if (file.builtin) statusElement.textContent = "Examples";
        else if (file.needsPermission) statusElement.textContent = "Reconnect to resume disk access";
        else statusElement.textContent = file.dirty ? "Not saved" : "Saved";
      }

      function renderFiles() {
        filesElement.replaceChildren();
        for (const file of session.files) {
          if (file.welcome) continue;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "LocalMarkdown-file";
          if (file === example) button.id = "LocalMarkdown-examples";
          button.draggable = true;
          button.dataset.fileId = file.id;

          enableFileReordering(button, file.id);
          filesElement.append(button);
        }

      function dropAfter(button, event) {
        const bounds = button.getBoundingClientRect();
        return event.clientY >= bounds.top + bounds.height / 2;
      }

      function previewFileOrder(target, placeAfter) {
        const buttons = Array.from(filesElement.querySelectorAll("[data-file-id]"));
        const draggedButton = buttons.find(button => button.dataset.fileId === draggedFileId);
        if (!draggedButton || draggedButton === target) return;

        for (const button of buttons) {
          for (const animation of button.getAnimations?.() || []) animation.cancel();
        }
        const previousTops = new Map(buttons.map(button => [button, button.getBoundingClientRect().top]));
        const reference = placeAfter ? target.nextElementSibling : target;
        filesElement.insertBefore(draggedButton, reference);

        for (const button of buttons) {
          if (button === draggedButton) continue;
          const offset = previousTops.get(button) - button.getBoundingClientRect().top;
          if (Math.abs(offset) < 1 || typeof button.animate !== "function") continue;
          button.animate(
            [{ transform: `translateY(${offset}px)` }, { transform: "translateY(0)" }],
            { duration: 150, easing: "cubic-bezier(.2, .8, .2, 1)" }
          );
        }

      function enableFileReordering(button, fileId) {
        button.addEventListener("dragstart", event => {
          draggedFileId = fileId;
          button.classList.add("LocalMarkdown-dragging");
          if (event.dataTransfer) {
            event.dataTransfer.effectAllowed = "move";
            event.dataTransfer.setData("text/plain", fileId);
          }

        button.addEventListener("dragover", event => {
          if (!draggedFileId || draggedFileId === fileId) return;
          event.preventDefault();
          if (event.dataTransfer) event.dataTransfer.dropEffect = "move";
          previewFileOrder(button, dropAfter(button, event));
        });
        button.addEventListener("dragend", () => {
          const cancelled = draggedFileId === fileId;
          draggedFileId = null;
          if (cancelled) renderFiles();
        });
      }

      function commitPreviewedFileOrder() {
        const filesById = new Map(session.files
          .filter(file => !file.welcome)
          .map(file => [file.id, file]));
        const orderedFiles = Array.from(filesElement.querySelectorAll("[data-file-id]"))
          .map(button => filesById.get(button.dataset.fileId))
          .filter(Boolean);
        let orderedIndex = 0;
        session.files = session.files.map(file => file.welcome
          ? file
          : (orderedFiles[orderedIndex++] || file));
        draggedFileId = null;
        renderFiles();
        scheduleSessionSave();
      }

      function activateFile(file, message = null) {
        const previous = activeFile();
        if (previous) releaseAttachmentPreviews(previous.id);
        if (!(file.attachments instanceof Map)) file.attachments = new Map();
        if (!session.files.includes(file)) session.files.push(file);
        session.activeId = file.id;
        if (file.handle) session.lastOpenHandle = file.handle;
        if (editorReady) editor.setValue(file.text, true);
        renderFiles();
        updateStatus(message);
        scheduleAttachmentPreviews();
        scheduleSessionSave();
      }

      function selectFile(id) {
        if (id === session.activeId) return;
        captureEditorValue();
        const file = session.files.find(item => item.id === id);
        if (file) activateFile(file);

      function showExamples() {

      function updateViewButtons(mode = "ir") {

      function switchEditorMode(mode) {

        captureEditorValue();
        const editModeElement = editor.vditor?.toolbar?.elements?.["edit-mode"];
        const modeButton = editModeElement?.querySelector(`button[data-mode="${mode}"]`);
        if (!modeButton) {

        modeButton.click();

        updateViewButtons(currentMode);
        if (currentMode !== mode) {
          updateStatus("Could not change editor view");
          return;
        }

        editor.focus();

      function noteTitle(file) {
        const first = file.text.split("\n").find(line => line.trim()) || "Untitled";
        return first.replace(/^#{1,6}\s+/, "").trim() || "Untitled";
      }

      function suggestedFileName(file) {
        const preferred = file.name !== "Untitled.md"
          ? file.name.replace(/\.(?:md|markdown)$/i, "")
          : noteTitle(file);
        const safe = preferred
          .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "-")
          .replace(/[.\s]+$/, "")
          .slice(0, 80);
        return `${safe || "Untitled"}.md`;
      }

      function nextUntitledName() {
        const names = new Set(session.files.map(file => file.name.toLowerCase()));
        for (let number = 1; number <= 1000; number += 1) {
          const name = number === 1 ? "Untitled.md" : `Untitled-${number}.md`;
          if (!names.has(name.toLowerCase())) return name;
        }
        return `Untitled-${Date.now()}.md`;
      }

      function createAttachmentId(file) {
        let id;
        do {
          if (typeof crypto.getRandomValues === "function") {
            const bytes = crypto.getRandomValues(new Uint8Array(6));
            id = Array.from(bytes, byte => byte.toString(16).padStart(2, "0")).join("");
          } else {
            id = `${Date.now().toString(36)}${Math.random().toString(36).slice(2, 8)}`;
          }
        } while (file.attachments.has(id));
        return id;
      }

      function attachmentPath(id) {
        return `${attachmentPathPrefix}${id}`;
      }

      function parseStoredMarkdown(storedText) {
        const match = storedText.match(
          /(?:\n{2,}|^)<!-- LocalMarkdown attachments:v1\n([\s\S]*?)\n-->\s*$/
        );
        if (!match) return { text: storedText, attachments: new Map(), warning: null };

        try {
          const manifest = JSON.parse(match[1]);
          if (manifest?.version !== 1 || !Array.isArray(manifest.attachments)) {
            throw new Error("Unsupported attachment manifest");
          }

          const attachments = new Map();
          for (const item of manifest.attachments) {
            if (!item || typeof item.id !== "string"
                || typeof item.type !== "string" || !item.type.startsWith("image/")
                || typeof item.data !== "string") continue;
            attachments.set(item.id, {
              id: item.id,
              type: item.type,
              data: item.data,
              blob: null,
              pending: null,
              error: false
            });
          }

          return {
            text: storedText.slice(0, match.index).replace(/\n+$/, ""),
            attachments,
            warning: null
          };
        } catch {
          return {
            text: storedText,
            attachments: new Map(),
            warning: "Attachment data could not be read"
          };
        }
      }

      function referencedAttachmentIds(text) {
        const ids = new Set();
        const pattern = new RegExp(`(?:${attachmentPathPrefixPattern})([a-z\\d-]+)`, "gi");
        for (const match of text.matchAll(pattern)) ids.add(match[1]);
        return ids;
      }

      function revokeAttachmentPreview(fileId, attachmentId) {
        const key = `${fileId}\n${attachmentId}`;
        const url = attachmentPreviewUrls.get(key);
        if (!url) return;
        URL.revokeObjectURL(url);
        attachmentPreviewUrls.delete(key);
      }

      function releaseAttachmentPreviews(fileId = null) {
        for (const [key, url] of attachmentPreviewUrls) {
          if (!fileId || key.startsWith(`${fileId}\n`)) {
            URL.revokeObjectURL(url);
            attachmentPreviewUrls.delete(key);
          }
        }
      }

      function canonicalEditorText(value, file) {
        let canonical = value;
        for (const [key, url] of attachmentPreviewUrls) {
          if (!key.startsWith(`${file.id}\n`)) continue;
          const id = key.slice(file.id.length + 1);
          canonical = canonical.split(url).join(attachmentPath(id));
        }
        return canonical;
      }

      function pruneUnusedAttachments(file) {
        const referenced = referencedAttachmentIds(file.text);
        for (const id of file.attachments.keys()) {
          if (referenced.has(id)) continue;
          revokeAttachmentPreview(file.id, id);
          file.attachments.delete(id);
        }
        return referenced;
      }

      function serializeFile(file) {
        const referenced = pruneUnusedAttachments(file);
        const attachments = [];
        for (const [id, attachment] of file.attachments) {
          if (!referenced.has(id) || !attachment.data) continue;
          attachments.push({ id, type: attachment.type, data: attachment.data });
        }
        if (!attachments.length) return file.text;

        const body = file.text.replace(/\n+$/, "");
        const manifest = JSON.stringify({ version: 1, attachments });
        return `${body}\n\n${attachmentBlockStart}\n${manifest}\n${attachmentBlockEnd}\n`;
      }

      function attachmentIdFromSource(source) {
        if (!source) return null;
        const match = source.match(new RegExp(
          `(?:^|/)(?:${attachmentPathPrefixPattern})([a-z\\d-]+)(?:[?#].*)?$`,
          "i"
        ));
        return match?.[1] || null;
      }

      function attachmentBlob(attachment) {
        if (attachment.blob) return attachment.blob;
        const binary = atob(attachment.data);
        const bytes = new Uint8Array(binary.length);
        for (let index = 0; index < binary.length; index += 1) {
          bytes[index] = binary.charCodeAt(index);
        }
        attachment.blob = new Blob([bytes], { type: attachment.type });
        return attachment.blob;
      }

      function refreshAttachmentPreviews() {
        if (!editorReady) return;
        const file = activeFile();
        if (!file || file.builtin || !file.attachments.size) return;
        const images = editorElement.querySelectorAll(
          ".vditor-ir img[src], .vditor-wysiwyg img[src], .vditor-preview img[src]"
        );
        for (const image of images) {
          const id = attachmentImageIds.get(image)
            || attachmentIdFromSource(image.getAttribute("src"));
          const attachment = id ? file.attachments.get(id) : null;
          if (!attachment || activeFile() !== file) continue;

          const key = `${file.id}\n${id}`;
          let url = attachmentPreviewUrls.get(key);
          if (!url) {
            try {
              url = URL.createObjectURL(attachmentBlob(attachment));
              attachmentPreviewUrls.set(key, url);
            } catch {
              continue;
            }
          }
          attachmentImageIds.set(image, id);
          if (image.getAttribute("src") !== url) image.src = url;
        }
      }

      function scheduleAttachmentPreviews() {
        clearTimeout(attachmentPreviewTimer);
        attachmentPreviewTimer = setTimeout(() => {
          attachmentPreviewTimer = null;
          refreshAttachmentPreviews();
        }, 0);
      }

      function observeAttachmentPreviews() {
        if (attachmentPreviewObserver || typeof MutationObserver !== "function") return;
        attachmentPreviewObserver = new MutationObserver(() => {
          refreshAttachmentPreviews();
        });
        attachmentPreviewObserver.observe(editorElement, {
          subtree: true,
          childList: true,
          attributes: true,
          attributeFilter: ["src"]
        });
      }

      function readBlobPayload(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.addEventListener("load", () => {
            const result = String(reader.result || "");
            const comma = result.indexOf(",");
            if (comma < 0) reject(new Error("Could not encode image"));
            else resolve({ type: blob.type || "image/png", data: result.slice(comma + 1), blob });
          });
          reader.addEventListener("error", () => reject(reader.error || new Error("Could not read image")));
          reader.readAsDataURL(blob);
        });
      }

      function canvasToBlob(canvas, type, quality) {
        return new Promise((resolve, reject) => {
          canvas.toBlob(
            blob => blob ? resolve(blob) : reject(new Error("Could not encode image")),
            type,
            quality
          );
        });
      }

      async function optimizeImageOnMainThread(file) {
        if (["image/gif", "image/svg+xml"].includes(file.type)) return readBlobPayload(file);
        try {
          const bitmap = await createImageBitmap(file);
          const scale = Math.min(1, pastedImageMaxDimension / Math.max(bitmap.width, bitmap.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.max(1, Math.round(bitmap.width * scale));
          canvas.height = Math.max(1, Math.round(bitmap.height * scale));
          canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          bitmap.close();
          const candidate = await canvasToBlob(canvas, "image/webp", pastedImageWebpQuality);
          const optimized = scale < 1 || candidate.size < file.size * 0.9 ? candidate : file;
          return readBlobPayload(optimized);
        } catch {
          return readBlobPayload(file);
        }
      }

      function getImageWorker() {
        if (imageWorker) return imageWorker;
        if (typeof Worker !== "function" || typeof OffscreenCanvas !== "function") return null;

        const source = `
          const readBlobPayload = blob => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => {
              const result = String(reader.result || "");
              const comma = result.indexOf(",");
              if (comma < 0) reject(new Error("Could not encode image"));
              else resolve({ type: blob.type || "image/png", data: result.slice(comma + 1), blob });
            };
            reader.onerror = () => reject(reader.error || new Error("Could not read image"));
            reader.readAsDataURL(blob);
          });

          const optimize = async (file, maxDimension, quality) => {
            if (["image/gif", "image/svg+xml"].includes(file.type)) return readBlobPayload(file);
            try {
              const bitmap = await createImageBitmap(file);
              const scale = Math.min(1, maxDimension / Math.max(bitmap.width, bitmap.height));
              const canvas = new OffscreenCanvas(
                Math.max(1, Math.round(bitmap.width * scale)),
                Math.max(1, Math.round(bitmap.height * scale))
              );
              canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
              bitmap.close();
              const candidate = await canvas.convertToBlob({ type: "image/webp", quality });
              const optimized = scale < 1 || candidate.size < file.size * 0.9 ? candidate : file;
              return readBlobPayload(optimized);
            } catch {
              return readBlobPayload(file);
            }
          };

          self.onmessage = async event => {
            const { requestId, file, maxDimension, quality } = event.data;
            try {
              const result = await optimize(file, maxDimension, quality);
              self.postMessage({ requestId, result });
            } catch (error) {
              self.postMessage({ requestId, error: error?.message || "Could not process image" });
            }
          };
        `;

        imageWorkerUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
        imageWorker = new Worker(imageWorkerUrl);
        imageWorker.addEventListener("message", event => {
          const request = imageWorkerRequests.get(event.data.requestId);
          if (!request) return;
          imageWorkerRequests.delete(event.data.requestId);
          clearTimeout(request.timer);
          if (event.data.error) request.reject(new Error(event.data.error));
          else request.resolve(event.data.result);
        });
        imageWorker.addEventListener("error", () => {
          for (const request of imageWorkerRequests.values()) {
            clearTimeout(request.timer);
            request.reject(new Error("Image worker failed"));
          }
          imageWorkerRequests.clear();
          imageWorker?.terminate();
          imageWorker = null;
          if (imageWorkerUrl) URL.revokeObjectURL(imageWorkerUrl);
          imageWorkerUrl = null;
        });
        return imageWorker;
      }

      function optimizeImageInWorker(file) {
        const worker = getImageWorker();
        if (!worker) return optimizeImageOnMainThread(file);
        const requestId = ++imageWorkerRequestId;
        return new Promise((resolve, reject) => {
          const timer = setTimeout(() => {
            imageWorkerRequests.delete(requestId);
            reject(new Error("Image processing timed out"));
          }, 30000);
          imageWorkerRequests.set(requestId, { resolve, reject, timer });
          worker.postMessage({
            requestId,
            file,
            maxDimension: pastedImageMaxDimension,
            quality: pastedImageWebpQuality
          });
        }).catch(() => optimizeImageOnMainThread(file));
      }

      async function processPastedAttachment(file, attachment, image) {
        const operation = (async () => {
          const result = await optimizeImageInWorker(image);
          attachment.type = result.type;
          attachment.data = result.data;
          attachment.blob = result.blob;
          attachment.error = false;
          revokeAttachmentPreview(file.id, attachment.id);
          if (activeFile() === file) scheduleAttachmentPreviews();
          file.dirty = true;
          scheduleAutoSave(file);
          scheduleSessionSave();
          return true;
        })().catch(() => {
          attachment.error = true;
          if (activeFile() === file) updateStatus("Could not embed pasted image");
          return false;
        });

        attachment.pending = operation;
        try {
          return await operation;
        } finally {
          if (attachment.pending === operation) attachment.pending = null;
        }
      }

      async function waitForFileAttachments(file) {
        const pending = Array.from(file.attachments.values())
          .map(attachment => attachment.pending)
          .filter(Boolean);
        if (pending.length) await Promise.allSettled(pending);
        const referenced = referencedAttachmentIds(file.text);
        return Array.from(referenced).every(id => {
          const attachment = file.attachments.get(id);
          return attachment?.data && !attachment.error;
        });
      }

      async function pasteEmbeddedImages(files) {
        const images = Array.from(files || []).filter(file => file?.type?.startsWith("image/"));
        if (!images.length || !editorReady) return null;

        const file = activeFile();
        if (!file || file.builtin || file.welcome) {
          updateStatus("Create or open a Markdown file before pasting images");
          return "Create or open a Markdown file before pasting images";
        }

        const attachments = images.map(image => {
          const id = createAttachmentId(file);
          const attachment = {
            id,
            type: image.type || "image/png",
            data: null,
            blob: image,
            pending: null,
            error: false
          };
          file.attachments.set(id, attachment);
          return { attachment, image };
        });

        editor.insertMD(attachments
          .map(({ attachment }) => `![Pasted image](${attachmentPath(attachment.id)})`)
          .join("\n\n"));
        file.text = canonicalEditorText(editor.getValue(), file);
        file.dirty = true;
        renderFiles();
        scheduleAttachmentPreviews();
        scheduleAutoSave(file);
        scheduleSessionSave();
        updateStatus(images.length === 1 ? "Embedding pasted image…" : `Embedding ${images.length} images…`);

        await new Promise(resolve => requestAnimationFrame(resolve));
        const results = await Promise.all(attachments.map(({ attachment, image }) =>
          processPastedAttachment(file, attachment, image)));

        if (activeFile() === file && results.every(Boolean)) {
          updateStatus(images.length === 1
            ? "Image embedded in Markdown"
            : `${images.length} images embedded in Markdown`);
        }
        renderFiles();
        scheduleAutoSave(file);
        scheduleSessionSave();
        return null;
      }

      function handleEditorKeydown(event) {
        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform);
        const commandKey = isMac ? event.metaKey : event.ctrlKey;
        if (!editorReady || !commandKey || !event.shiftKey || event.altKey
            || event.key.toLowerCase() !== "z") return;
        event.preventDefault();
        event.stopImmediatePropagation();
        editor.vditor.undo.redo(editor.vditor);
      }

      function handleEditorViewShortcut(event) {
        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform);
        const commandKey = isMac ? event.metaKey : event.ctrlKey;
        if (!editorReady || !commandKey || !event.altKey || event.shiftKey) return;
        const mode = ({ Digit7: "wysiwyg", Digit8: "ir", Digit9: "sv" })[event.code];
        if (!mode) return;
        event.preventDefault();
        event.stopImmediatePropagation();
        switchEditorMode(mode);
      }

      async function writeText(handle, text) {
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
      }

      function cancelAutoSave(file) {
        const timer = autoSaveTimers.get(file.id);
        if (timer) clearTimeout(timer);
        autoSaveTimers.delete(file.id);
      }

      function markdownPickerOptions(options = {}) {
        return {
          id: markdownPickerId,
          types: markdownPickerTypes,
          ...(session.lastOpenHandle ? { startIn: session.lastOpenHandle } : {}),
          ...options
        };

      async function pickMarkdownFile(file) {
        if (typeof window.showSaveFilePicker !== "function") {
          updateStatus("Saving local files requires Chrome");
          return null;
        }
        try {
          return await window.showSaveFilePicker(markdownPickerOptions({
            suggestedName: suggestedFileName(file),
            excludeAcceptAllOption: true
          }));
        } catch (error) {
          if (error?.name === "AbortError") updateStatus();
          else updateStatus("Could not choose file name");
          return null;
        }
      }

      async function saveFile(file) {
        if (file.builtin || !file.handle) return false;
        const currentSave = activeSaves.get(file.id);
        if (currentSave) {
          if (!await currentSave) return false;
          return file.dirty ? saveFile(file) : true;
        }

        const operation = (async () => {
          if (!await waitForFileAttachments(file)) return false;
          const text = file.text;
          const storedText = serializeFile(file);
          try {
            await writeText(file.handle, storedText);
            file.name = file.handle.name;
            file.needsPermission = false;
            if (file.text === text) file.dirty = false;
            scheduleSessionSave();
            return true;
          } catch (error) {
            if (["NotAllowedError", "SecurityError"].includes(error?.name)) {
              file.needsPermission = true;
              scheduleSessionSave();
            }
            return false;
          }
        })();

        activeSaves.set(file.id, operation);
        try {
          return await operation;
        } finally {
          activeSaves.delete(file.id);
        }
      }

      function scheduleAutoSave(file) {
        if (file.builtin || !file.handle) return;
        cancelAutoSave(file);
        const timer = setTimeout(async () => {
          autoSaveTimers.delete(file.id);
          if (!session.files.includes(file) || !file.dirty) return;
          if (activeFile() === file) updateStatus("Saving…");
          const saved = await saveFile(file);
          if (activeFile() === file) {
            updateStatus(saved
              ? (file.dirty ? "Not saved" : "Saved automatically")
              : "Could not autosave");
          }
          renderFiles();
          scheduleSessionSave();
          if (saved && file.dirty) scheduleAutoSave(file);
        }, autoSaveDelay);
        autoSaveTimers.set(file.id, timer);
      }

      async function saveActiveFile() {
        captureEditorValue();
        const file = activeFile();
        if (file.builtin) return;

        if (file.handle) {
          updateStatus("Reconnecting to local file…");
          try {
            const permission = typeof file.handle.requestPermission === "function"
              ? await file.handle.requestPermission({ mode: "readwrite" })
              : "granted";
            if (permission !== "granted") {
              file.needsPermission = true;
              updateStatus("File access was not restored");
              scheduleSessionSave();
              return;
            }

            file.needsPermission = false;
            let message = "Reconnected to local file";
            if (file.dirty) {
              const saved = await saveFile(file);
              message = saved ? "Saved" : "Could not save file";
            } else {
              message = await loadFileFromHandle(file) || message;
              if (editorReady && activeFile() === file) editor.setValue(file.text, true);
              scheduleAttachmentPreviews();
            }
            renderFiles();
            updateStatus(message);
            scheduleSessionSave();
          } catch {
            file.needsPermission = true;
            updateStatus("Could not reconnect local file");
            scheduleSessionSave();
          }
          return;
        }

        updateStatus("Choose a file name and folder…");
        const previousName = file.name;
        const handle = await pickMarkdownFile(file);
        if (!handle || activeFile() !== file) return;
        file.handle = handle;
        file.name = handle.name;
        file.needsPermission = false;
        cancelAutoSave(file);
        updateStatus("Saving…");
        const saved = await saveFile(file);
        if (!saved) {
          file.handle = null;
          file.name = previousName;
        } else {
          session.lastOpenHandle = handle;
        }
        renderFiles();
        updateStatus(saved
          ? (file.dirty ? "Not saved" : "Saved")
          : "Could not save file");
        scheduleSessionSave();
        if (saved && file.dirty) scheduleAutoSave(file);
      }

      async function openLocalFile() {
        if (typeof window.showOpenFilePicker !== "function") {
          updateStatus("Opening local files requires Chrome");
          return;
        }

        let handle;
        try {
          [handle] = await window.showOpenFilePicker(markdownPickerOptions({ multiple: false }));
        } catch (error) {
          if (error?.name === "AbortError") updateStatus();
          else updateStatus("Could not choose file");
          return;
        }

        for (const file of session.files) {
          if (!file.handle || typeof file.handle.isSameEntry !== "function") continue;
          try {
            if (await file.handle.isSameEntry(handle)) {
              captureEditorValue();
              activateFile(file, "File is already open");
              return;
            }
          } catch {}
        }

        captureEditorValue();
        updateStatus("Opening Markdown file…");
        try {
          const file = await handle.getFile();
          const parsed = parseStoredMarkdown(await file.text());
          activateFile({
            id: createId(), name: file.name, text: parsed.text, handle,
            attachments: parsed.attachments, builtin: false, dirty: false,
            needsPermission: false
          }, parsed.warning || "Opened local file");
        } catch {
          updateStatus("Could not open file");
        }
      }

          hljs: {
            style: document.documentElement.dataset.theme === "white"
              ? "github"
              : `base16/${document.documentElement.dataset.theme}`
          }
        },
        resize: { enable: false },
        upload: {
          multiple: true,
          handler: pasteEmbeddedImages
        },
        theme: "classic",
        lang: "en_US",
        placeholder: "Write Markdown…",
        input(value) {
          const file = activeFile();
          const canonical = canonicalEditorText(value, file);
          if (canonical === file.text) return;
          file.text = canonical;
          if (!file.builtin) {
            file.dirty = true;
            scheduleAutoSave(file);
            scheduleSessionSave();
          }
          renderFiles();
          updateStatus();
          scheduleAttachmentPreviews();
        },
        after() {
          editorReady = true;
          setTheme(document.documentElement.dataset.theme, { persist: false });
          for (const button of viewButtons) button.disabled = false;
          updateViewButtons(editor.getCurrentMode());
          observeAttachmentPreviews();
          editor.setValue(activeFile().text, true);
          updateStatus();
          scheduleAttachmentPreviews();
        }
      });

      addEventListener("unload", () => {
        attachmentPreviewObserver?.disconnect();
        releaseAttachmentPreviews();
        imageWorker?.terminate();
        if (imageWorkerUrl) URL.revokeObjectURL(imageWorkerUrl);
      });
    })();
  </script>
</body>
</html>
