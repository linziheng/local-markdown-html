<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Markdown</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vditor@3.11.2/dist/index.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      color: #111;
      background: #fff;
      font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { color: inherit; background: #fff; border: 1px solid #d8d8d8; border-radius: 5px; font: inherit; cursor: pointer; }
    button:hover { background: #f6f6f6; }
    button:disabled { color: #aaa; cursor: default; }
    button:focus-visible { outline: 2px solid #111; outline-offset: 2px; }

    .LocalMarkdown-app { height: 100%; display: grid; grid-template-columns: 220px minmax(0, 1fr); }
    .LocalMarkdown-sidebar { min-width: 0; overflow: auto; border-right: 1px solid #e5e5e5; }
    .LocalMarkdown-sidebar-header,
    .LocalMarkdown-toolbar { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #e5e5e5; }
    .LocalMarkdown-sidebar-header strong { flex: 1; }
    .LocalMarkdown-new { width: 30px; height: 30px; padding: 0; font-size: 20px; line-height: 1; }
    .LocalMarkdown-files { padding: 8px; }
    .LocalMarkdown-file {
      width: 100%; margin: 0 0 3px; padding: 8px 9px; overflow: hidden;
      border: 0; text-align: left; text-overflow: ellipsis; white-space: nowrap;
    }
    .LocalMarkdown-file[aria-current="true"] { background: #f1f1f1; font-weight: 600; }

    .LocalMarkdown-main { min-width: 0; min-height: 0; display: grid; grid-template-rows: 52px minmax(0, 1fr); }
    .LocalMarkdown-toolbar { justify-content: flex-end; }
    .LocalMarkdown-status { margin-right: auto; color: #666; font-size: 13px; }
    .LocalMarkdown-action { padding: 5px 10px; }
    .LocalMarkdown-editor { min-width: 0; min-height: 0; overflow: hidden; }

    .LocalMarkdown-editor .vditor { height: 100% !important; border: 0; border-radius: 0; }
    .LocalMarkdown-editor .vditor-toolbar,
    .LocalMarkdown-editor .vditor-counter,
    .LocalMarkdown-editor .vditor-resize { display: none !important; }
    .LocalMarkdown-editor .vditor-content { height: 100% !important; }
    .LocalMarkdown-editor .vditor-ir { width: min(820px, 100%); margin: 0 auto; padding: 42px 40px 120px !important; background: #fff; }
    .LocalMarkdown-editor .vditor-reset { color: #111; font-family: inherit; }

    @media (max-width: 650px) {
      .LocalMarkdown-app { grid-template-columns: 150px minmax(0, 1fr); }
      .LocalMarkdown-sidebar-header { padding: 0 8px; }
      .LocalMarkdown-toolbar { padding: 0 8px; gap: 5px; }
      .LocalMarkdown-action { padding: 5px 7px; }
      .LocalMarkdown-editor .vditor-ir { padding: 28px 18px 100px !important; }
    }
  </style>
</head>
<body>
  <div class="LocalMarkdown-app">
    <aside class="LocalMarkdown-sidebar" aria-label="Local Markdown open files">
      <div class="LocalMarkdown-sidebar-header">
        <strong>Local Markdown</strong>
        <button class="LocalMarkdown-new" id="LocalMarkdown-new" type="button" aria-label="New file">+</button>
      </div>
      <nav class="LocalMarkdown-files" id="LocalMarkdown-files" aria-label="Open files"></nav>
    </aside>

    <main class="LocalMarkdown-main">
      <div class="LocalMarkdown-toolbar">
        <span class="LocalMarkdown-status" id="LocalMarkdown-status" role="status">Loading editor…</span>
        <button class="LocalMarkdown-action" id="LocalMarkdown-examples" type="button">Examples</button>
        <button class="LocalMarkdown-action" id="LocalMarkdown-open-file" type="button">Open file</button>
        <button class="LocalMarkdown-action" id="LocalMarkdown-save-file" type="button">Save</button>
        <button class="LocalMarkdown-action" id="LocalMarkdown-close-file" type="button">Close</button>
      </div>
      <div class="LocalMarkdown-editor" id="LocalMarkdown-editor"></div>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/vditor@3.11.2/dist/index.min.js"></script>
  <script>
    (() => {
      "use strict";

      const vditorCdn = "https://cdn.jsdelivr.net/npm/vditor@3.11.2";
      const filesElement = document.querySelector("#LocalMarkdown-files");
      const statusElement = document.querySelector("#LocalMarkdown-status");
      const closeButton = document.querySelector("#LocalMarkdown-close-file");
      const saveButton = document.querySelector("#LocalMarkdown-save-file");
      const editorElement = document.querySelector("#LocalMarkdown-editor");
      let editor = null;
      let editorReady = false;
      let lastAttachmentTime = 0;
      let imagePreviewTimer = null;
      const localImageUrls = new Map();
      const autoSaveTimers = new Map();
      const activeSaves = new Map();
      const autoSaveDelay = 700;

      const exampleText = [
        "# Markdown examples",
        "",
        "This built-in file shows common Markdown in Vditor IR mode.",
        "Local Markdown opens files individually and edits one active file at a time. Open files stay in the left sidebar. New files show Save until their first manual save; opened and saved files autosave about 700 milliseconds after you stop typing.",
        "",
        "## Inline text",
        "**Bold text**, *italic text*, ~~strikethrough~~, and `inline code`.",
        "",
        "## Lists",
        "- Unordered item",
        "1. Ordered item",
        "- [ ] Open task",
        "- [x] Completed task",
        "",
        "## Quote",
        "> A quoted line",
        "",
        "## Code block",
        "```js",
        "const message = \"Hello, Local Markdown\";",
        "console.log(message);",
        "```",
        "",
        "## Table",
        "| Feature | Example |",
        "| --- | --- |",
        "| Heading | # Title |",
        "| Task | - [ ] Todo |",
        "",
        "## Keyboard shortcuts",
        "These shortcuts are available in Local Markdown's minimal IR editor.",
        "",
        "### General editing",
        "| Action | Mac | Windows |",
        "| --- | --- | --- |",
        "| Undo | `⌘ + Z` | `Ctrl + Z` |",
        "| Redo | `⌘ + Shift + Z` | `Ctrl + Y` or `Ctrl + Shift + Z` |",
        "| Copy | `⌘ + C` | `Ctrl + C` |",
        "| Cut | `⌘ + X` | `Ctrl + X` |",
        "| Paste | `⌘ + V` | `Ctrl + V` |",
        "| Select all | `⌘ + A` | `Ctrl + A` |",
        "| Close suggestions | `Escape` | `Escape` |",
        "",
        "### Markdown blocks",
        "| Action | Mac | Windows |",
        "| --- | --- | --- |",
        "| Heading level 1–6 | `⌘ + Option + 1–6` | `Ctrl + Alt + 1–6` |",
        "| Make current heading larger | `⌘ + =` | `Ctrl + =` |",
        "| Make current heading smaller | `⌘ + -` | `Ctrl + -` |",
        "| Toggle a task item | `⌘ + Shift + J` | `Ctrl + Shift + J` |",
        "| Indent a list item | `Tab` | `Tab` |",
        "| Outdent a list item | `Shift + Tab` | `Shift + Tab` |",
        "| Select the current code block | `⌘ + A` | `Ctrl + A` |",
        "",
        "### Editor views",
        "| View | Mac | Windows |",
        "| --- | --- | --- |",
        "| WYSIWYG | `⌘ + Option + 7` | `Ctrl + Alt + 7` |",
        "| Instant rendering (current) | `⌘ + Option + 8` | `Ctrl + Alt + 8` |",
        "| Split view | `⌘ + Option + 9` | `Ctrl + Alt + 9` |",
        "",
        "### Tables",
        "Place the caret inside a table cell before using these shortcuts.",
        "",
        "| Action | Mac | Windows |",
        "| --- | --- | --- |",
        "| New line inside the current cell | `Enter` | `Enter` |",
        "| Next cell | `Tab` | `Tab` |",
        "| Previous cell | `Shift + Tab` | `Shift + Tab` |",
        "| Cell above or below | `↑` or `↓` | `↑` or `↓` |",
        "| Add row above | `⌘ + Shift + F` | `Ctrl + Shift + F` |",
        "| Add row below | `⌘ + =` | `Ctrl + =` |",
        "| Add column to the left | `⌘ + Shift + G` | `Ctrl + Shift + G` |",
        "| Add column to the right | `⌘ + Shift + =` | `Ctrl + Shift + =` |",
        "| Delete current row | `⌘ + -` | `Ctrl + -` |",
        "| Delete current column | `⌘ + Shift + -` | `Ctrl + Shift + -` |",
        "| Align current column left | `⌘ + Shift + L` | `Ctrl + Shift + L` |",
        "| Align current column center | `⌘ + Shift + C` | `Ctrl + Shift + C` |",
        "| Align current column right | `⌘ + Shift + R` | `Ctrl + Shift + R` |",
        "",
        "## Image",
        "Paste a clipboard image with `⌘ + V` (Mac) or `Ctrl + V` (Windows). The first time Local Markdown needs image access, it asks you to choose the folder containing the Markdown file, then saves the image there as a PNG or JPEG with an ordered timestamp and a random suffix.",
        "",
        "Standard Markdown has no image-size syntax. Use an HTML image tag and change `width` to the size you want in pixels. If you leave out `height`, the image keeps its original proportions.",
        "",
        "<img src=\"dog.png\" alt=\"Dog\" width=\"320\">",
        "",
        "---"
      ].join("\n");

      const createId = () => crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`;
      const example = {
        id: "LocalMarkdown-examples", name: "Markdown examples", text: exampleText,
        handle: null, directoryHandle: null, builtin: true, dirty: false
      };
      const welcome = {
        id: "LocalMarkdown-welcome", name: "", text: "", handle: null, directoryHandle: null,
        builtin: true, welcome: true, dirty: false
      };
      const session = { activeId: example.id, files: [example] };

      function activeFile() {
        return session.files.find(file => file.id === session.activeId);
      }

      function captureEditorValue() {
        if (!editorReady) return;
        const file = activeFile();
        const value = editor.getValue();
        if (value === file.text) return;
        file.text = value;
        if (!file.builtin) {
          file.dirty = true;
          scheduleAutoSave(file);
        }
      }

      function updateStatus(message = null) {
        const file = activeFile();
        closeButton.disabled = Boolean(file.welcome);
        saveButton.hidden = Boolean(file.builtin || file.welcome || file.handle);
        if (message) statusElement.textContent = message;
        else if (file.welcome) statusElement.textContent = "Open a file or view Examples";
        else if (file.builtin) statusElement.textContent = "Examples";
        else statusElement.textContent = file.dirty ? "Not saved" : "Saved";
      }

      function renderFiles() {
        filesElement.replaceChildren();
        for (const file of session.files) {
          if (file.builtin) continue;
          const button = document.createElement("button");
          button.type = "button";
          button.className = "LocalMarkdown-file";
          button.textContent = `${file.name}${file.dirty ? " •" : ""}`;
          button.setAttribute("aria-current", String(file.id === session.activeId));
          button.addEventListener("click", () => selectFile(file.id));
          filesElement.append(button);
        }
      }

      function activateFile(file, message = null) {
        const previous = activeFile();
        if (previous) releaseLocalImageUrls(previous.id);
        if (!session.files.includes(file)) session.files.push(file);
        session.activeId = file.id;
        if (editorReady) editor.setValue(file.text, true);
        renderFiles();
        updateStatus(message);
        scheduleLocalImagePreviews();
      }

      function selectFile(id) {
        if (id === session.activeId) return;
        captureEditorValue();
        const file = session.files.find(item => item.id === id);
        if (file) activateFile(file);
      }

      function showExamples() {
        if (activeFile() === example) return;
        captureEditorValue();
        example.text = exampleText;
        activateFile(example);
      }

      function noteTitle(file) {
        const first = file.text.split("\n").find(line => line.trim()) || "Untitled";
        return first.replace(/^#{1,6}\s+/, "").trim() || "Untitled";
      }

      function suggestedFileName(file) {
        const preferred = file.name !== "Untitled.md"
          ? file.name.replace(/\.(?:md|markdown)$/i, "")
          : noteTitle(file);
        const safe = preferred
          .replace(/[<>:"/\\|?*\u0000-\u001F]/g, "-")
          .replace(/[.\s]+$/, "")
          .slice(0, 80);
        return `${safe || "Untitled"}.md`;
      }

      function nextUntitledName() {
        const names = new Set(session.files.map(file => file.name.toLowerCase()));
        for (let number = 1; number <= 1000; number += 1) {
          const name = number === 1 ? "Untitled.md" : `Untitled-${number}.md`;
          if (!names.has(name.toLowerCase())) return name;
        }
        return `Untitled-${Date.now()}.md`;
      }

      async function unusedMarkdownName(directoryHandle, suggestedName) {
        const base = suggestedName.replace(/\.md$/i, "");
        for (let number = 1; number <= 1000; number += 1) {
          const name = number === 1 ? `${base}.md` : `${base}-${number}.md`;
          try {
            await directoryHandle.getFileHandle(name);
          } catch (error) {
            if (error?.name === "NotFoundError") return name;
            throw error;
          }
        }
        throw new Error("Could not create a unique Markdown name");
      }

      function orderedAttachmentName(extension) {
        const time = Math.max(Date.now(), lastAttachmentTime + 1);
        lastAttachmentTime = time;
        const date = new Date(time);
        const pad = (value, length = 2) => String(value).padStart(length, "0");
        const timestamp = [
          date.getFullYear(), pad(date.getMonth() + 1), pad(date.getDate())
        ].join("") + `-${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}-${pad(date.getMilliseconds(), 3)}`;
        const randomBytes = new Uint8Array(3);
        crypto.getRandomValues(randomBytes);
        const random = Array.from(randomBytes, value => value.toString(16).padStart(2, "0")).join("");
        return `${timestamp}-${random}.${extension}`;
      }

      async function normalizePastedImage(file) {
        const type = file.type.toLowerCase();
        if (type === "image/png") return { blob: file, extension: "png" };
        if (type === "image/jpeg" || type === "image/jpg") {
          return { blob: file, extension: "jpg" };
        }

        const bitmap = await createImageBitmap(file);
        try {
          const canvas = document.createElement("canvas");
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          canvas.getContext("2d").drawImage(bitmap, 0, 0);
          const blob = await new Promise((resolve, reject) => {
            canvas.toBlob(result => result ? resolve(result) : reject(new Error("PNG conversion failed")), "image/png");
          });
          return { blob, extension: "png" };
        } finally {
          bitmap.close();
        }
      }

      async function unusedAttachmentName(directoryHandle, extension) {
        for (let attempt = 0; attempt < 20; attempt += 1) {
          const name = orderedAttachmentName(extension);
          try {
            await directoryHandle.getFileHandle(name);
          } catch (error) {
            if (error?.name === "NotFoundError") return name;
            throw error;
          }
        }
        throw new Error("Could not create a unique image name");
      }

      async function savePastedImage(directoryHandle, file) {
        const { blob, extension } = await normalizePastedImage(file);
        const name = await unusedAttachmentName(directoryHandle, extension);
        const handle = await directoryHandle.getFileHandle(name, { create: true });
        try {
          const writable = await handle.createWritable();
          await writable.write(blob);
          await writable.close();
          return name;
        } catch (error) {
          try { await directoryHandle.removeEntry(name); } catch {}
          throw error;
        }
      }

      function clipboardImageFiles(event) {
        const itemFiles = Array.from(event.clipboardData?.items || [])
          .filter(item => item.kind === "file" && item.type.startsWith("image/"))
          .map(item => item.getAsFile())
          .filter(Boolean);
        if (itemFiles.length) return itemFiles;
        return Array.from(event.clipboardData?.files || [])
          .filter(file => file.type.startsWith("image/"));
      }

      function handleEditorKeydown(event) {
        const isMac = /Mac|iPhone|iPad|iPod/.test(navigator.platform);
        const commandKey = isMac ? event.metaKey : event.ctrlKey;
        if (!editorReady || !commandKey || !event.shiftKey || event.altKey
            || event.key.toLowerCase() !== "z") return;
        event.preventDefault();
        event.stopImmediatePropagation();
        editor.vditor.undo.redo(editor.vditor);
      }

      function selectedEditorRange() {
        const selection = getSelection();
        if (!selection.rangeCount) return null;
        const range = selection.getRangeAt(0);
        return editorElement.contains(range.commonAncestorContainer) ? range.cloneRange() : null;
      }

      function restoreEditorRange(range) {
        if (!range) {
          editor.focus();
          return;
        }
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function releaseLocalImageUrls(fileId) {
        for (const [key, url] of localImageUrls) {
          if (!fileId || key.startsWith(`${fileId}\n`)) {
            URL.revokeObjectURL(url);
            localImageUrls.delete(key);
          }
        }
      }

      function relativeImagePath(source) {
        if (!source || /^(?:[a-z][a-z\d+.-]*:|[\\/#])/i.test(source)) return null;
        const withoutQuery = source.split(/[?#]/, 1)[0];
        let decoded;
        try { decoded = decodeURIComponent(withoutQuery); } catch { decoded = withoutQuery; }
        const parts = decoded.replace(/\\/g, "/").split("/").filter(part => part && part !== ".");
        return parts.length && !parts.includes("..") ? parts : null;
      }

      async function fileHandleAtPath(directoryHandle, parts) {
        let current = directoryHandle;
        for (const part of parts.slice(0, -1)) {
          current = await current.getDirectoryHandle(part);
        }
        return current.getFileHandle(parts.at(-1));
      }

      async function refreshLocalImagePreviews() {
        if (!editorReady) return;
        const file = activeFile();
        if (file.builtin || !file.directoryHandle) return;
        const images = editorElement.querySelectorAll(".vditor-ir img[src], .vditor-wysiwyg img[src]");
        for (const image of images) {
          const parts = relativeImagePath(image.getAttribute("src"));
          if (!parts || activeFile() !== file) continue;
          const path = parts.join("/");
          const key = `${file.id}\n${path}`;
          let url = localImageUrls.get(key);
          if (!url) {
            try {
              const handle = await fileHandleAtPath(file.directoryHandle, parts);
              url = URL.createObjectURL(await handle.getFile());
              localImageUrls.set(key, url);
            } catch {
              continue;
            }
          }
          image.src = url;
        }
      }

      function scheduleLocalImagePreviews() {
        clearTimeout(imagePreviewTimer);
        imagePreviewTimer = setTimeout(() => {
          imagePreviewTimer = null;
          void refreshLocalImagePreviews();
        }, 0);
      }

      async function pasteLocalImages(event) {
        const images = clipboardImageFiles(event);
        if (!images.length || !editorReady) return;
        const range = selectedEditorRange();
        event.preventDefault();
        event.stopImmediatePropagation();

        const file = activeFile();
        if (file.builtin) {
          updateStatus("Create or open a Markdown file before pasting images");
          return;
        }
        if (!file.directoryHandle) {
          updateStatus(`Choose the folder containing ${file.name}…`);
          const directoryHandle = await pickContainingDirectory(file);
          if (!directoryHandle || activeFile() !== file) return;
          file.directoryHandle = directoryHandle;
        }
        if (!file.handle) {
          updateStatus("Saving Markdown file…");
          await saveActiveFile();
          if (!file.handle || activeFile() !== file) return;
        }

        const directoryHandle = file.directoryHandle;
        updateStatus(images.length === 1 ? "Saving pasted image…" : `Saving ${images.length} pasted images…`);

        const names = [];
        try {
          for (const image of images) {
            names.push(await savePastedImage(directoryHandle, image));
          }
        } catch {
          await Promise.allSettled(names.map(name => directoryHandle.removeEntry(name)));
          updateStatus("Could not save pasted image");
          return;
        }

        restoreEditorRange(range);
        editor.insertMD(names.map(name => `![Pasted image](${name})`).join("\n\n"));
        file.text = editor.getValue();
        file.dirty = true;
        scheduleAutoSave(file);
        renderFiles();
        scheduleLocalImagePreviews();
        updateStatus(names.length === 1
          ? `Image saved as ${names[0]}; autosaving Markdown…`
          : `${names.length} images saved; autosaving Markdown…`);
      }

      async function writeText(handle, text) {
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
      }

      function cancelAutoSave(file) {
        const timer = autoSaveTimers.get(file.id);
        if (timer) clearTimeout(timer);
        autoSaveTimers.delete(file.id);
      }

      async function pickMarkdownDirectory() {
        if (typeof window.showDirectoryPicker !== "function") {
          updateStatus("Opening local folders requires Chrome");
          return null;
        }
        try {
          return await window.showDirectoryPicker({
            id: "LocalMarkdownFileFolder",
            mode: "readwrite"
          });
        } catch (error) {
          if (error?.name === "AbortError") updateStatus();
          else updateStatus("Could not choose folder");
          return null;
        }
      }

      async function pickContainingDirectory(file) {
        const directoryHandle = await pickMarkdownDirectory();
        if (!directoryHandle || !file.handle) return directoryHandle;
        try {
          const candidate = await directoryHandle.getFileHandle(file.handle.name);
          if (typeof file.handle.isSameEntry !== "function"
              || await file.handle.isSameEntry(candidate)) return directoryHandle;
        } catch {}
        updateStatus(`Choose the folder containing ${file.name}`);
        return null;
      }

      async function saveFile(file) {
        if (file.builtin || (!file.handle && !file.directoryHandle)) return false;
        const currentSave = activeSaves.get(file.id);
        if (currentSave) {
          if (!await currentSave) return false;
          return file.dirty ? saveFile(file) : true;
        }

        const directoryHandle = file.directoryHandle;
        const operation = (async () => {
          const text = file.text;
          let handle = file.handle;
          let createdName = null;
          try {
            if (!handle) {
              createdName = await unusedMarkdownName(directoryHandle, suggestedFileName(file));
              handle = await directoryHandle.getFileHandle(createdName, { create: true });
            }
            await writeText(handle, text);
            file.handle = handle;
            file.name = handle.name;
            if (file.text === text) file.dirty = false;
            return true;
          } catch {
            if (createdName) {
              try { await directoryHandle.removeEntry(createdName); } catch {}
            }
            return false;
          }
        })();

        activeSaves.set(file.id, operation);
        try {
          return await operation;
        } finally {
          activeSaves.delete(file.id);
        }
      }

      function scheduleAutoSave(file) {
        if (file.builtin || !file.handle) return;
        cancelAutoSave(file);
        const timer = setTimeout(async () => {
          autoSaveTimers.delete(file.id);
          if (!session.files.includes(file) || !file.dirty) return;
          if (activeFile() === file) updateStatus("Saving…");
          const saved = await saveFile(file);
          if (activeFile() === file) {
            updateStatus(saved
              ? (file.dirty ? "Not saved" : "Saved automatically")
              : "Could not autosave");
          }
          renderFiles();
          if (saved && file.dirty) scheduleAutoSave(file);
        }, autoSaveDelay);
        autoSaveTimers.set(file.id, timer);
      }

      async function saveActiveFile() {
        captureEditorValue();
        const file = activeFile();
        if (file.builtin || file.handle) return;

        if (!file.directoryHandle) {
          updateStatus("Choose this file's folder…");
          const directoryHandle = await pickMarkdownDirectory();
          if (!directoryHandle || activeFile() !== file) return;
          file.directoryHandle = directoryHandle;
        }
        cancelAutoSave(file);
        updateStatus("Saving…");
        const saved = await saveFile(file);
        renderFiles();
        updateStatus(saved
          ? (file.dirty ? "Not saved" : "Saved")
          : "Could not save file");
        if (saved && file.dirty) scheduleAutoSave(file);
      }

      async function openLocalFile() {
        if (typeof window.showOpenFilePicker !== "function") {
          updateStatus("Opening local files requires Chrome");
          return;
        }

        let handle;
        try {
          [handle] = await window.showOpenFilePicker({
            multiple: false,
            types: [{
              description: "Markdown file",
              accept: { "text/markdown": [".md", ".markdown"] }
            }]
          });
        } catch (error) {
          if (error?.name === "AbortError") updateStatus();
          else updateStatus("Could not choose file");
          return;
        }

        for (const file of session.files) {
          if (!file.handle || typeof file.handle.isSameEntry !== "function") continue;
          try {
            if (await file.handle.isSameEntry(handle)) {
              captureEditorValue();
              activateFile(file, "File is already open");
              return;
            }
          } catch {}
        }

        captureEditorValue();
        updateStatus("Opening Markdown file…");
        try {
          const file = await handle.getFile();
          activateFile({
            id: createId(), name: file.name, text: await file.text(), handle,
            directoryHandle: null, builtin: false, dirty: false
          }, "Opened local file");
        } catch {
          updateStatus("Could not open file");
        }
      }

      document.querySelector("#LocalMarkdown-new").addEventListener("click", () => {
        captureEditorValue();
        const name = nextUntitledName();
        const file = {
          id: createId(), name, text: `# ${name.replace(/\.md$/i, "")}`,
          handle: null, directoryHandle: null,
          builtin: false, dirty: true
        };
        activateFile(file);
        editor?.focus();
      });

      document.querySelector("#LocalMarkdown-examples").addEventListener("click", showExamples);
      document.querySelector("#LocalMarkdown-open-file").addEventListener("click", openLocalFile);
      document.querySelector("#LocalMarkdown-save-file").addEventListener("click", saveActiveFile);
      editorElement.addEventListener("keydown", handleEditorKeydown, true);
      editorElement.addEventListener("paste", pasteLocalImages, true);

      closeButton.addEventListener("click", async () => {
        captureEditorValue();
        const file = activeFile();
        if (file.welcome) return;
        if (!file.builtin && file.dirty) {
          cancelAutoSave(file);
          if (file.handle) {
            updateStatus("Saving…");
            await saveFile(file);
          }
        }
        if (!file.builtin && file.dirty && !confirm(`Close “${file.name}” without saving?`)) {
          scheduleAutoSave(file);
          updateStatus();
          return;
        }

        cancelAutoSave(file);
        releaseLocalImageUrls(file.id);
        session.files = session.files.filter(item => item !== file && !item.welcome);
        let next = session.files.find(item => !item.builtin) || session.files[0];
        if (!next) {
          session.files.push(welcome);
          next = welcome;
        }
        activateFile(next);
      });

      addEventListener("beforeunload", event => {
        captureEditorValue();
        if (!session.files.some(file => !file.builtin && file.dirty)) return;
        event.preventDefault();
        event.returnValue = "";
      });

      renderFiles();
      updateStatus();

      editor = new Vditor("LocalMarkdown-editor", {
        cdn: vditorCdn,
        mode: "ir",
        value: example.text,
        height: "100%",
        minHeight: 200,
        toolbar: [],
        cache: { enable: false },
        counter: { enable: false },
        outline: { enable: false },
        resize: { enable: false },
        theme: "classic",
        lang: "en_US",
        placeholder: "Write Markdown…",
        input(value) {
          const file = activeFile();
          if (value === file.text) return;
          file.text = value;
          if (!file.builtin) {
            file.dirty = true;
            scheduleAutoSave(file);
          }
          renderFiles();
          updateStatus();
          scheduleLocalImagePreviews();
        },
        after() {
          editorReady = true;
          editor.setValue(activeFile().text, true);
          updateStatus();
          scheduleLocalImagePreviews();
        }
      });
    })();
  </script>
</body>
</html>
